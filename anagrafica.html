
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Anagrafica</title>
    </head>
    <body>

        <h2>ANAGRAFICA 1.0</h2>

        <form id="formDati">

            Nome:
            <input type="text" id="nome">
            <br><br>

            Cognome:
            <input type="text" id="cognome">
            <br><br>

            Età:
            <input type="number" id="eta">
            <br><br>

            Sesso:
            <input type="radio" name="sesso" value="Maschio"> Maschio
            <input type="radio" name="sesso" value="Femmina"> Femmina
            <br><br>

            Indirizzo:
            <input type="text" id="indirizzo">
            <br><br>

            Città:
            <input type="text" id="citta">
            <br><br>

            Provincia:
            <select id="provincia">
                <option value="">Seleziona</option>
                <option value="Milano">Milano</option>
                <option value="Roma">Roma</option>
                <option value="Torino">Torino</option>
                <option value="Napoli">Napoli</option>
                <option value="Bergamo">Bergamo</option>
                <option value="Brescia">Brescia</option>
            </select>
            <br><br>

            Sport praticati:
            <input type="checkbox" name="sport" value="Calcio"> Calcio
            <input type="checkbox" name="sport" value="Nuoto"> Nuoto
            <input type="checkbox" name="sport" value="Tennis"> Tennis
            <input type="checkbox" name="sport" value="Pallavolo"> Pallavolo
            <br><br>

            Commenti:
            <br>
            <textarea id="commenti" rows="4" cols="30"></textarea>
            <br><br>

            <input type="button" value="Invia" onclick="fill()">

            <input type="button" value="Cancella tabella" onclick="clearTable()">

        </form>

        <h2>Tabella dati</h2>

        <table border="1">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Età</th>
                    <th>Sesso</th>
                    <th>Indirizzo</th>
                    <th>Città</th>
                    <th>Provincia</th>
                    <th>Sport</th>
                    <th>Commenti</th>
                </tr>
            </thead>

            <tbody id="tabellaDati">
            </tbody>

        </table>

        <br>
        <a href="index.html">Back to index</a>

        <script>

            function fill() {

                // Ottiene i dati inseriti
                let nome = document.getElementById("nome").value;
                let cognome = document.getElementById("cognome").value;
                let eta = document.getElementById("eta").value;

                let indirizzo = document.getElementById("indirizzo").value;
                let citta = document.getElementById("citta").value;
                let provincia = document.getElementById("provincia").value;
                
                let commenti = document.getElementById("commenti").value;

                // Ottiene il sesso
                let sesso = "";
                let elementiSesso = document.getElementsByName("sesso");

                for (let i = 0; i < elementiSesso.length; i++) {
                    if (elementiSesso[i].checked) {
                        sesso = elementiSesso[i].value;
                    }
                }

                // Ottiene gli sport selezionati
                let sport = document.getElementsByName("sport");

                let sportScelti = [];

                for (let i = 0; i < sport.length; i++) {
                    if (sport[i].checked) {
                        sportScelti.push(sport[i].value);
                    }
                }

                // Crea una nuova righa nella tabella
                let tabella = document.getElementById("tabellaDati");

                let riga = tabella.insertRow();

                // Crea array con tutti i dati
                let dati = [nome, cognome, eta, sesso, indirizzo, citta, provincia, sportScelti.join(", "), commenti];

                // Inserisce i dati nella tabella
                for (let i = 0; i < dati.length; i++) {
                    let cella = riga.insertCell();
                    cella.textContent = dati[i];
                }
            }

            function clearTable() {
                let tabella = document.getElementById("tabellaDati");
                tabella.innerHTML = "";
            }

        </script>

    </body>
</html>
